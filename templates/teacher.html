{% extends "layout.html" %}
{% block body %}

<nav class="w3-bar">
    <div class="w3-bar-item">
        <div class="logo">
            <h1> Logo </h1> 
        </div>
    </div>
    <div class="teacher-navigation">
        <h1><a href="/" class="w3-bar-item w3-button" >Home</a></h1>
        <h1><a href="/admin" class="w3-bar-item w3-button" >Admin</a></h1>
        <h1><a href="/logout" class="w3-bar-item w3-button" >Log Out</a></h1>
        <h1><a href="/signup" class="w3-bar-item w3-button" >Sign Up</a></h1>
    </div>
</nav>

<style>
  html, body {
    height: auto;
    overflow: hidden;
  }
</style>

<h1>Welcome, {{ teacher[2] }}!</h1>
<p>Your Role: Teacher</p>

<table class="years-table">
    {% for year in years %}
    <tr>
        <td> <a href="/teacher/{{ teacher.id }}/year/{{ year[0] }}" class="btn years-table-btn">Year {{ year[0] }}</a> </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
